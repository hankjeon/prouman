# 가장 작은 시작 예제: 연중 사업 1개, 사람 1명.
projects:
  - name: 연구 지원 사업  # 사업명 중간 공백은 허용합니다.
    alias: 연구지원       # 사람 파일에서는 이 약칭을 참조합니다.
    period: "2027-01-01~2027-12-31"  # 시작일·종료일을 모두 포함합니다.
    yearly:
      2027:  # 연도 키는 따옴표 없는 정수입니다.
        allocated_manpower: "1.00000"  # 연간 상한입니다. 반드시 소진할 필요는 없습니다.
        # excluded_months는 생략하면 제외 월 없음으로 처리합니다. []로 명시해도 같습니다.
