# 의도적인 경고 예제: 경고가 있어도 유효한 배분은 성공 종료합니다.
projects:
  - name: 연중 운영
    alias: 운영
    period: "2027-01-01~2027-12-31"
    yearly:
      2027:
        allocated_manpower: "2.00000"
        excluded_months: []
