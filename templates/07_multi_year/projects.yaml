      2028:
        allocated_manpower: "1.00000"
        excluded_months: []
  - name: 연중 운영 사업
    alias: 운영
    period: "2026-01-01~2028-12-31"
    yearly:
      2026:
        allocated_manpower: "1.00000"
        excluded_months: []
      2027:
        allocated_manpower: "1.00000"
        excluded_months: []
      2028:
        allocated_manpower: "1.00000"
